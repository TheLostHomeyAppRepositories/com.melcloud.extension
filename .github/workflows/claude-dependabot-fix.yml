# workflow_run (not pull_request) is deliberate: dependabot-triggered runs
# get a read-only token and only dependabot secrets, so they cannot reach
# CLAUDE_CODE_OAUTH_TOKEN — this run executes in the default-branch context
# instead. Claude pushes through its GitHub App token, which re-triggers CI
# (a GITHUB_TOKEN push would not), and the dependabot auto-merge workflow
# then completes the loop once green.
concurrency:
  cancel-in-progress: false
  group: claude-dependabot-fix-${{ github.event.workflow_run.head_branch }}
jobs:
  fix:
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    uses: OlivierZal/configs/.github/workflows/reusable-claude-dependabot-fix.yml@b6fc63379fae3634daf4dd9495295b6d95f6b7fe # v4.4.0
    with:
      repo-guidance: 'The app ids `com.mecloud` and `com.mecloud.extension` carry a load-bearing historical typo — never "correct" the spelling anywhere (manifest, code, docs or links). When the bump is `@olivierzal/configs`, move the workflow `uses:` refs to the tag the npm pin names, since one version covers both channels, and resolve every version comment against the upstream with `git ls-remote --tags` instead of guessing it. Stop and leave the PR red when the release changes lint policy: adopting that needs a per-repo verdict, not an automated fix.'
      verify-commands: '`npm run format`, `npm run lint`, `npm run typecheck`, `npm test`, `npm run build`, and `npm run homey:validate`'
name: Claude Dependabot Fix
on:
  workflow_run:
    types: [completed]
    # The repo's two always-running required build gates (see ruleset).
    workflows: [CI, Validate]
permissions: {}
